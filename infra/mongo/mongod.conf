# Production MongoDB, installed natively by infra/server/setup-mongo.sh (docs/adr/0010).
# Loopback only, single-node replica set (transactions need one), auth through a key file.
storage:
  dbPath: /var/lib/mongodb
systemLog:
  destination: file
  logAppend: true
  logRotate: reopen
  path: /var/log/mongodb/mongod.log
net:
  port: 27017
  bindIp: 127.0.0.1
replication:
  replSetName: rs0
security:
  authorization: enabled
  keyFile: /etc/mongod.key
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# Optional local MongoDB: a single-node replica set on 127.0.0.1:27018 (transactions need a replica set).
#   docker compose -f infra/docker-compose.yml up -d
services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start; the member address must be reachable from the host
      test:
        - CMD
        - mongosh
        - --port
        - "27018"
        - --quiet
        - --eval
        - "try { rs.status().ok } catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27018' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:

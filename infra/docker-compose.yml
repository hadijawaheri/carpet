# MongoDB (single-node replica set, auth on) and Redis on loopback only.
# The API connects as `farsh_app`, which can only read and write the `farsh` database; root is for
# backups and admin work.
#   cp infra/.env.example infra/.env   # then set both passwords
#   docker compose -f infra/docker-compose.yml up -d
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/farsh/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in infra/.env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in infra/.env}
    ports:
      # Loopback only: the database must never be reachable from outside the machine
      - "127.0.0.1:27018:27018"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./mongo:/farsh:ro
      - ./mongo/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro
    healthcheck:
      # Initiates the replica set on first start; the member address must be reachable from the host
      test:
        - CMD-SHELL
        - >-
          mongosh --port 27018 --quiet -u root -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval
          "try { rs.status().ok } catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27018' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Only rate-limit counters live here; losing them on restart is harmless, so no persistence
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  mongo-data:
  mongo-config:
